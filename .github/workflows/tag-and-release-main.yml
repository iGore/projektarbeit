name: Tag and Release on Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate semantic release tag
        id: tag
        run: |
          latest_tag=""
          while IFS= read -r tag; do
            latest_tag="$tag"
            break
          done < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)

          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"

          commit_message="$(git log -1 --pretty=%B "${GITHUB_SHA}")"
          commit_message_lc="$(printf '%s' "$commit_message" | tr '[:upper:]' '[:lower:]')"

          bump_type="patch"
          if printf '%s' "$commit_message_lc" | grep -Eq '(^feat(\([^)]+\))?!?:)|(^minor:)|(\[minor\])'; then
            bump_type="minor"
          fi

          if [ "$bump_type" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          tag_name="v${major}.${minor}.${patch}"

          while git rev-parse "$tag_name" >/dev/null 2>&1; do
            patch=$((patch + 1))
            tag_name="v${major}.${minor}.${patch}"
          done

          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "bump_type=${bump_type}" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.tag.outputs.tag_name }}"
          git push origin "${{ steps.tag.outputs.tag_name }}"

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Capture commit message
        id: commit
        run: |
          {
            echo "message<<EOF"
            git log -1 --pretty=%B "${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release notes
        run: |
          cat > release-notes.md <<EOF
          Release-Typ: ${{ steps.tag.outputs.bump_type }}

          ${{ steps.commit.outputs.message }}
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          body_path: release-notes.md
          files: main.pdf
