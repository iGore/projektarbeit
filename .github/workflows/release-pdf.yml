name: Release PDF

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
          # -halt-on-error bewusst entfernt: bei biblatex+biber gibt es beim ersten Pass
          # immer "undefined citation"-Warnungen, bevor biber ueberhaupt laeuft.
          # -f (force) laesst latexmk trotz Warnungen weiterarbeiten und alle Passes
          # (pdflatex -> biber -> pdflatex -> pdflatex) durchlaufen.
          args: -pdf -f -file-line-error -interaction=nonstopmode

      - name: Capture commit message
        id: commit
        run: |
          {
            echo "message<<EOF"
            git log -1 --pretty=%B "${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release notes
        run: |
          cat > release-notes.md <<EOF
          ${{ steps.commit.outputs.message }}
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: main.pdf
