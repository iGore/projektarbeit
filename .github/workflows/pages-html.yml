name: Publish LaTeX HTML to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-html:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build HTML from LaTeX
        run: |
          mkdir -p site
          make4ht -u -d site main.tex

      - name: Copy static assets
        run: |
          cp -R abbildungen site/abbildungen
          cp main.pdf site/main.pdf || true

      - name: Add index redirect
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="de">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=main.html">
              <title>Projektarbeit</title>
            </head>
            <body>
              <p>Weiterleitung zu <a href="main.html">main.html</a> ...</p>
            </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-html

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
